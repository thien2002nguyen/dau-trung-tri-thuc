<!doctype html>
<html lang="vi">

<head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Đấu trường tri thức</title>
      <link rel="icon" type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏆%3C/text%3E%3C/svg%3E">
      <link rel="stylesheet" href="style.css">
</head>

<body>
      <div class="ambient"></div>
      <main id="app">
            <header><button id="home" class="iconbtn" title="Về màn hình chọn">⌂</button>
                  <div class="brand"><span class="spark">✦</span> ĐẤU TRƯỜNG <b>TRI THỨC</b></div>
                  <div class="right"><span id="progress">0/10</span><button id="music" class="iconbtn"
                              title="Bật/tắt nhạc">♫</button></div>


            </header>
            <section id="menu" class="screen">
                  <h1>CHỌN HỘP QUÀ<br><em>KHÁM PHÁ THỬ THÁCH</em></h1>
                  <div id="gifts" class="gifts"></div>
                  <div class="menufoot"><span id="completed">Đã mở 0/10 hộp</span><button id="reset" class="smallbtn">↻
                              Chơi lại từ đầu</button></div>
            </section>
            <section id="play" class="screen hidden">
                  <div class="stage">
                        <div class="meta">
                              <div class="meta-labels"><span id="category" class="pill">TRẮC NGHIỆM</span><span
                                          id="number" class="stage-number">HỘP 01</span></div>
                              <div class="clock-face" id="clockFace" role="timer" aria-label="Thời gian còn lại"><svg
                                          class="clock-ring" viewBox="0 0 120 120" aria-hidden="true">
                                          <circle class="clock-track" cx="60" cy="60" r="52" />
                                          <circle class="clock-progress" id="clockProgress" cx="60" cy="60" r="52" />
                                    </svg>
                                    <div class="clock-inner"><span class="timer" id="timer">15</span></div>
                              </div>
                        </div>
                        <div class="question" id="question"></div>
                        <div id="content" class="content"></div>
                        <div class="bottom">
                              <div class="status" id="status">Nhấn BẮT ĐẦU để chạy đồng hồ</div>
                        </div>
                  </div>
                  <div class="controls"><button id="back" class="smallbtn">← Về hộp quà</button><button id="action"
                              class="primary">▶ BẮT ĐẦU 15 GIÂY</button><button id="next" class="smallbtn">Về chọn hộp
                              →</button></div>
            </section>
            <section id="finish" class="screen hidden">
                  <div class="trophy">🏆</div>
                  <h1>HOÀN THÀNH!</h1>
                  <p class="intro">Bạn đã khám phá tất cả các hộp quà.</p><button id="again" class="primary">↻ CHƠI
                        LẠI</button>
            </section>
      </main><audio id="bgm" src="assets/audio/nhac_nen.mp3" loop preload="auto"></audio>
      <audio id="tickSound" src="assets/audio/tieng_tictac.mp3" loop preload="auto"></audio>
      <audio id="applauseSound" src="assets/audio/tieng_votay.mp3" preload="auto"></audio>
      <script src="data/questions.js"></script>
      <script src="script.js"></script>
</body>

</html>
